{% extends "base.html" %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-primary text-white">
        <h4>Créer un Ticket</h4>
    </div>

    <div class="card-body">

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label>Titre</label>
                {{ form.titre }}
            </div>

            <div class="mb-3">
                <label>Description</label>
                {{ form.description }}
            </div>

            <div class="mb-3">
                <label>Équipement</label>
                {{ form.equipement }}
            </div>

            <div class="mb-3">
                <label>Type de demande</label>
                {{ form.type_demande }}
            </div>
    
            <button class="btn btn-success">
                Enregistrer
            </button>

            <a href="{% url 'liste_tickets' %}"
               class="btn btn-secondary">
               Annuler
            </a>

        </form>

    </div>
</div>

{% endblock %}
