{% extends "base.html" %}

{% block content %}

<div class="max-w-xl mx-auto bg-white shadow rounded-lg p-6">
    <h2 class="text-2xl font-bold mb-4">
        {% if equipement %}Modifier l'équipement{% else %}Nouvel équipement{% endif %}
    </h2>

    <form method="post">
        {% csrf_token %}

        <div class="space-y-4">
            {{ form.as_p }}
        </div>

        <div class="mt-4 flex gap-2">
            <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                Enregistrer
            </button>
            <a href="{% url 'liste_equipements' %}" class="bg-gray-300 text-gray-800 px-4 py-2 rounded hover:bg-gray-400">
                Annuler
            </a>
        </div>
    </form>
</div>

{% endblock %}
