{% extends "base.html" %}

{% block content %}

<div class="max-w-md mx-auto bg-white shadow rounded-lg p-6">
    <h2 class="text-2xl font-bold mb-4">
        Nouveau type d'intervention
    </h2>

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}

        {% for field in form %}
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.errors %}
                    <p class="text-red-600 text-xs mt-1">
                        {{ field.errors|striptags }}
                    </p>
                {% endif %}
            </div>
        {% endfor %}

        <div class="mt-4 flex gap-2">
            <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                Enregistrer
            </button>
            <a href="{% url 'creer_intervention' %}" class="bg-gray-300 text-gray-800 px-4 py-2 rounded hover:bg-gray-400">
                Retour au formulaire d'intervention
            </a>
        </div>
    </form>
</div>

{% endblock %}
